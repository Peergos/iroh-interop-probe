[package]
name = "interop-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iroh = { version = "=1.3.0", features = ["tls-ring"] }
noq = { version = "1.3.0", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std"] }
ring = "0.17"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-lite = "2"
hex = "0.4"
blake3 = "1"
pkarr = { path = "../pkarr/pkarr", default-features = false, features = ["dht"] }
mainline = { version = "8", default-features = false }
